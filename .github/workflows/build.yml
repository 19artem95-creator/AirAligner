name: Build AirAligner APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/airaligner
          mv AirOsClient.kt app/src/main/java/com/example/airaligner/ 2>/dev/null || true
          mv AudioBeepEngine.kt app/src/main/java/com/example/airaligner/ 2>/dev/null || true
          mv MainActivity.kt app/src/main/java/com/example/airaligner/ 2>/dev/null || true
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirAligner-APK
          path: app/build/outputs/apk/debug/app-debug.apk

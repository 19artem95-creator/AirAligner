name: Build AirAligner APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Full Android Project Framework
        run: |
          # 1. Корневые настройки Gradle
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirAligner"
          include(":app")
          EOF

          # 2. Корневой build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. Создаем структуру каталогов
          mkdir -p app/src/main/java/com/example/airaligner

          # 4. Переносим исходники в нужную папку
          mv AirOsClient.kt app/src/main/java/com/example/airaligner/ 2>/dev/null || true
          mv AudioBeepEngine.kt app/src/main/java/com/example/airaligner/ 2>/dev/null || true
          mv MainActivity.kt app/src/main/java/com/example/airaligner/ 2>/dev/null || true
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true

          # 5. Конфигурация модуля app
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.airaligner"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.airaligner"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.10.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirAligner-APK
          path: app/build/outputs/apk/debug/app-debug.apk

          
